[package]
name = "mod_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"
dotenvy = "0.15"
url = "2.5.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
